name: ci

on:
  push:
  pull_request:

jobs:
  devkit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # NOTE: GitHub-hosted macOS runners don't provide a Docker daemon, so we can’t
      # run docker compose there. We still validate Foundry on macOS.
      - name: Start devkit (docker compose, full profile)
        if: runner.os == 'Linux'
        working-directory: rootstock-devkit
        run: docker compose --profile full up -d

      - name: Wait for RSKj RPC
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","method":"web3_clientVersion","params":[],"id":1}' \
              http://127.0.0.1:4444/ >/dev/null; then
              echo "RSKj is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "RSKj did not become healthy in time"
          docker compose -f rootstock-devkit/docker-compose.yml ps
          docker logs --tail=200 rootstock-rskj-regtest || true
          exit 1

      - name: Blockscout API check (200)
        if: runner.os == 'Linux'
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:4001/api/v2/blocks

      - name: Forge build + test
        working-directory: rootstock-devkit/foundry
        run: |
          forge build
          forge test

      - name: Shutdown
        if: always()
        working-directory: rootstock-devkit
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            docker compose --profile full down -v --remove-orphans
          fi
        shell: bash

