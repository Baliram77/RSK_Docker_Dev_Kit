# Rootstock (RSKj) regtest config for local dev

# Use custom genesis with pre-funded dev accounts
genesis = "/etc/rsk/genesis.json"

# JSON-RPC (HTTP)
rpc {
  providers: {
    web: {
      cors: "*"
      http: {
        enabled: true
        bind_address: "0.0.0.0"
        port: 4444
        hosts: ["localhost", "127.0.0.1", "rskj"]
      }
      ws: {
        enabled: true
        bind_address: "0.0.0.0"
        port: 4445
      }
    }
  }

  modules = [
    { name: "eth", version: "1.0", enabled: "true" },
    { name: "net", version: "1.0", enabled: "true" },
    { name: "rpc", version: "1.0", enabled: "true" },
    { name: "web3", version: "1.0", enabled: "true" },
    { name: "evm", version: "1.0", enabled: "true" },
    { name: "txpool", version: "1.0", enabled: "true" },
    { name: "personal", version: "1.0", enabled: "true" },
    { name: "mnr", version: "1.0", enabled: "true" }
  ]
}

# Autominer: mine a block immediately when a tx arrives (Ganache-like)
miner.client.autoMine = true

# Keep peering simple for regtest
peer.discovery.enabled = false

