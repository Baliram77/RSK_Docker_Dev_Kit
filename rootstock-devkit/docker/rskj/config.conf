# Rootstock (RSKj) regtest config for local dev

# Use custom genesis with pre-funded dev accounts
genesis = "/etc/rsk/genesis.json"

# Explicitly select regtest config (regtest mode still enabled by `--regtest`)
blockchain.config.name = "regtest"

# JSON-RPC (HTTP)
# Security (local dev): restrict CORS to localhost (see reference.conf defaults).
# RPC modules below disable personal/debug/trace to reduce attack surface vs open CORS=*.
rpc {
  providers {
    web {
      cors = "localhost"

      http {
        enabled = true
        bind_address = "0.0.0.0"
        port = 4444
        hosts = ["*"]
      }

      ws {
        enabled = true
        bind_address = "0.0.0.0"
        port = 4445
      }
    }
  }

  # Module allowlist (same shape as rskj reference.conf). Omitted modules are not enabled.
  modules {
    eth { version: "1.0", enabled: "true" }
    net { version: "1.0", enabled: "true" }
    rpc { version: "1.0", enabled: "true" }
    web3 { version: "1.0", enabled: "true" }
    evm { version: "1.0", enabled: "true" }
    sco { version: "1.0", enabled: "false" }
    txpool { version: "1.0", enabled: "true" }
    personal { version: "1.0", enabled: "false" }
    debug { version: "1.0", enabled: "false" }
    trace { version: "1.0", enabled: "false" }
    rsk {
      version: "1.0"
      enabled: "true"
      methods: {
        disabled: [ "rsk_shutdown", "rsk_flush", "rsk_getStorageBytesAt" ]
      }
    }
  }
}


# Autominer: mine a block immediately when a tx arrives (Ganache-like)
miner.client.autoMine = true

# Keep peering simple for regtest
peer.discovery.enabled = false
peer.networkId = 7771
peer.port = 5050
