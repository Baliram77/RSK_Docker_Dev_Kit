server {
  listen 8080;

  # Minimal reverse proxy that forces an allowed Host header for RSKj RPC.
  # Blockscout sends Host based on the URL hostname (docker service name),
  # and RSKj rejects it (400) via DNS-rebinding protection.
  location / {
    proxy_pass http://rskj:4444;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host "localhost:4444";

    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }
}

