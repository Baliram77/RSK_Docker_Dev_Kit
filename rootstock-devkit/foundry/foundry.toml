[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Rootstock regtest settings
chain_id = 33

# Rootstock is EVM-compatible; Istanbul is a safe baseline for broad compatibility
evm_version = "istanbul"

# Deterministic build settings
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
rsk = "http://localhost:4444"
